project:
  type: book
  output-dir: docs
  resources:
    - mathjax/**

book:
  title: "Manifesto Of Categorical Nonsense"
  author: "James R. P. Turesson"
  date: last-modified
  chapters:
    - index.qmd
    - intro.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
    html-math-method:
      method: mathjax
      url: ./mathjax/tex-chtml.js
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            tex: {
              macros: {
                norm:  ["\\left\\lVert #1 \\right\\rVert", 1],
                abs:   ["\\left\\lvert #1 \\right\\rvert", 1],
                ip:    ["\\langle #1, #2 \\rangle", 2],
                Ob:  "\\operatorname{Ob}",
                Mor:  "\\operatorname{Mor}",
                dom:  "\\operatorname{dom}",
                cod:  "\\operatorname{cod}",
                id:  "\\operatorname{id}",
                Spec:  "\\operatorname{Spec}",
                supp:  "\\operatorname{supp}",
                RR:    "\\mathbb{R}",
                CC:    "\\mathbb{C}",
                Hzero: "H^1_0",
                Grp: "\\operatorname{Grp}"
              }
            }
          };
          </script>

